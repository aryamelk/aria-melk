<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>آریا ملک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font/dist/font-face.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font/dist/font-face.css" rel="stylesheet">
<style>
@font-face{font-family:'IRANSansX';src:url('https://cdn.fontcdn.ir/Font/Persian/IRANSansX/IRANSansX-Regular.woff2') format('woff2'),url('https://cdn.fontcdn.ir/Font/Persian/IRANSansX/IRANSansX-Regular.woff') format('woff');font-display:swap}
:root{--navy:#16294a;--navy2:#1f3a66;--gold:#b08d2f;--gold2:#d4b262;--goldbg:#f5f0e1;--bg:#e9edf5;--card:#fff;--mut:#6b7590;--ok:#1a7a3c;--warn:#c07f00;--err:#b33;--line:#d8dfeb;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:#1c2740;font-size:14px;line-height:1.8}
header{background:linear-gradient(180deg,#152745,#0f1d36);color:#fff;padding:12px 14px 14px;position:sticky;top:0;z-index:40;box-shadow:0 4px 14px rgba(6,13,26,.45)}
header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,rgba(212,178,98,.2),#f0d78c 30%,#a9852a 70%,rgba(212,178,98,.2));box-shadow:0 1px 7px rgba(212,178,98,.55)}
.hrow{display:flex;align-items:center;gap:12px;max-width:1150px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.4em;font-weight:900;font-size:clamp(24px,4.2vw,38px);line-height:1.3;white-space:nowrap;padding:2px}
.brand .medal{width:clamp(40px,5.8vw,54px);height:auto;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.brand .sep{color:rgba(212,178,98,.75);font-weight:400;padding:0 .34em}
.brand .b2{color:#f0d78c}
.fmenu-wrap{position:relative}
.fontbtn{width:38px;height:38px;border-radius:50%;background:var(--navy2);border:1px solid rgba(212,178,98,.4);color:#f0d78c;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.fmenu{position:absolute;top:calc(100% + 8px);inset-inline-start:0;background:#fff;color:#1c2740;border-radius:12px;box-shadow:0 10px 26px rgba(6,13,26,.35);padding:6px;display:none;z-index:60;min-width:160px}
.fmenu.open{display:block}
.fmenu button{display:block;width:100%;text-align:right;background:none;border:none;padding:8px 14px;border-radius:8px;font-family:inherit;font-size:13.5px;color:#1c2740;cursor:pointer}
.fmenu button:hover{background:#f1f4fa}
.fmenu button.on{color:var(--gold);font-weight:700}
nav.topnav{display:flex;gap:5px;flex-wrap:wrap;margin-inline-start:auto}
nav.topnav button{background:rgba(255,255,255,.05);border:1px solid rgba(212,178,98,.25);color:#c9d4e8;font-family:inherit;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:38px;position:relative}
nav.topnav button:hover{color:#fff;background:rgba(255,255,255,.11)}
nav.topnav button.active{background:linear-gradient(135deg,rgba(212,178,98,.95),rgba(169,133,42,.75));color:#0d1830;font-weight:700;border-color:transparent;box-shadow:0 2px 9px rgba(0,0,0,.4)}
.nbadge{position:absolute;top:-6px;inset-inline-end:-8px;background:linear-gradient(135deg,#ff7a6e,#d63b2f);color:#fff;font-size:9.5px;font-weight:700;min-width:16px;height:16px;line-height:16px;border-radius:9px;text-align:center;padding:0 3px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.bottombar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:45;background:linear-gradient(180deg,#16294a,#0d1830);justify-content:space-around;align-items:stretch;padding:7px 2px calc(8px + env(safe-area-inset-bottom));border-top:2px solid transparent;border-image:linear-gradient(90deg,rgba(212,178,98,.15),#d4b262,rgba(212,178,98,.15)) 1}
.bottombar button{background:none;border:none;color:#8fa2c2;font-family:inherit;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;padding:2px 1px;cursor:pointer;flex:1;min-width:0}
.bottombar button .ic{font-size:16px;line-height:1.2}
.bottombar button.active{color:#f0d78c;font-weight:700}
.bottombar button.active .ic{text-shadow:0 0 10px rgba(212,178,98,.65)}
.bottombar .nbadge{top:-5px;inset-inline-end:2px}
main{max-width:1150px;margin:0 auto;padding:16px 14px 70px}
.pagehead{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.pagehead h2{font-size:18px;color:var(--navy)}
.pagehead .btn{margin-inline-start:auto}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:150px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cardx{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.cardx h3{color:var(--navy);font-size:15px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:.15s}
.stat:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(22,41,74,.10)}
.stat .num{font-size:26px;font-weight:700;color:var(--navy)}
.stat .lbl{font-size:12.5px;color:var(--mut)}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:#fff;font-weight:700}
.btn.gold:hover{background:#9a7926}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fdecec;color:var(--err);border:1px solid #f2caca}
.btn.sm{padding:5px 12px;font-size:12.5px;min-height:34px;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mini{background:#eef2f9;color:var(--navy);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-family:inherit;font-size:12px;cursor:pointer;min-height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-family:inherit;user-select:none;min-height:34px;display:inline-flex;align-items:center}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:#fff;color:#1c2740}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(176,141,47,.20)}
textarea{resize:vertical;min-height:64px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(175px,1fr))}
.row.tight{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.row.tight .field{margin-bottom:8px}
.row.tight input,.row.tight select{padding:7px 9px;font-size:13px}
.stepper{display:flex;gap:5px;align-items:center}
.stepper input{text-align:center;flex:1;min-width:0;padding:7px 4px}
.phasebtn{width:100%;justify-content:center;font-weight:700}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pimg{width:100%;height:150px;object-fit:cover;background:#e8edf5;cursor:pointer}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pid{font-size:11.5px;color:var(--mut);margin-inline-start:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px}
.st0{background:#e4f2e7;color:var(--ok)}.st1{background:#fdf3dc;color:var(--warn)}.st2{background:#e3ecfa;color:#2456a8}.st3{background:#ffe9d6;color:#a75a00}.st4{background:#fde3e1;color:var(--err)}.st5{background:#eceff3;color:#6b7787}
.t0{background:#e3ecfa;color:#2456a8}.t1{background:#e4f2e7;color:var(--ok)}
.tM{background:#e3ecfa;color:#1f3a66}.tC{background:var(--goldbg);color:#8a6d1c}
.ptitle{font-weight:700;color:var(--navy);font-size:14.5px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12.5px;color:#41506b}
.pprice{font-weight:700;color:var(--navy);font-size:13.5px}
.lock{color:#8a6d1c;font-size:12px;font-weight:400}
.plink,.pmeta,.pdates{font-size:12px;color:var(--mut)}
.plink a,.tel,.mttl a,.mlink{color:var(--navy2);text-decoration:none;font-weight:600}
.pnotes{background:#f7f4e9;border:1px solid #e2d8b8;border-radius:10px;padding:6px 10px;font-size:12px}
.due{color:var(--err);font-size:12px;font-weight:700}
.pbtns{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:12.5px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mscore{font-size:19px;font-weight:700;color:var(--ok);min-width:58px;text-align:center}
.mbody{flex:1;min-width:220px}
.mttl{font-weight:700;color:var(--navy);font-size:13.5px}
.mreasons{font-size:11.5px;color:var(--mut);margin-top:4px}
.bar{height:8px;background:#e8edf5;border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:6px}
.empty{text-align:center;color:var(--mut);padding:26px 10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.emptyok{border-color:#bfe3c8;color:var(--ok);background:#f2faf4}
.modal-bg{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:860px;padding:18px;margin:auto}
.modal h3{color:var(--navy);margin-bottom:12px;font-size:16.5px}
.modal .fbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .fbtns .gold{flex:1;justify-content:center}
.draftbar{background:var(--goldbg);border:1px solid var(--gold2);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mediabox{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:flex-start}
.mthumb{width:86px;height:86px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.mthumb.cover{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldbg)}
.mthumb.vid{background:#16294a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:4px}
.mcoverlbl{font-size:11px;color:#8a6d1c;font-weight:700}
.mediagrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mediagrid2 img,.mediagrid2 video{width:100%;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:12px;z-index:300;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;white-space:normal;text-align:center}
.errbox{position:fixed;top:70px;left:10px;right:10px;z-index:500;background:#fdecec;border:2px solid var(--err);color:var(--err);border-radius:12px;padding:10px 14px;font-size:13px;max-width:640px;margin:0 auto;white-space:pre-wrap}
.sect{font-weight:700;color:var(--navy);margin:16px 0 8px;border-bottom:2px solid var(--gold2);padding-bottom:4px;font-size:14.5px}
.wrow{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.3fr auto;gap:6px;align-items:end;border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:6px;background:#fafbfd}
.wrow .field{margin-bottom:0}
.wrow input,.wrow select{padding:6px 8px;font-size:12.5px}
.frow2{border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:6px;background:#fafbfd}
.frow2 .grid3{display:grid;grid-template-columns:1fr 1.4fr 1.3fr;gap:6px;margin-bottom:6px}
.frow2 .grid3 .field{margin-bottom:0}
.frow2 input,.frow2 select{padding:6px 8px;font-size:12.5px}
.wdel{background:#fdecec;color:var(--err);border:1px solid #f2caca;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12px;cursor:pointer;min-height:34px}
.relbar{background:#eef4ff;border:1px solid #cddcf5;border-radius:10px;padding:5px 10px;font-size:12px;color:#2c4a7c}
.priorbar{background:#fdecec;border:1px solid #f2caca;color:var(--err);border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard3{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.visitrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.visitrow .field{margin-bottom:0}
.todobox{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:end;border:1px dashed var(--gold2);background:var(--goldbg);border-radius:12px;padding:10px;margin-bottom:12px}
.todobox .field{margin-bottom:0}
.pdone{text-decoration:line-through;color:var(--mut);opacity:.75}
.rtbox{background:var(--card);border:2px solid var(--gold2);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(22,41,74,.08)}
.rthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rthead h3{color:var(--navy);font-size:16px;margin:0}
.rtsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rtsum div{background:#f4f7fd;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:11px;color:var(--mut)}
.rtsum b{display:block;font-size:20px;color:var(--navy)}
.rtsum .d b{color:var(--ok)}
.rtsum .l b{color:var(--err)}
.rtcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rtcat{border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--navy)}
.rtcat:hover{border-color:var(--gold)}
.rtcat .cn{margin-inline-start:auto;background:var(--navy);color:#fff;border-radius:10px;padding:0 8px;font-size:11px}
.rtcat .cn.z{background:#e4f2e7;color:var(--ok)}
.rtitem{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;flex-wrap:wrap}
.rtitem .lb{flex:1;min-width:150px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy)}
.rtitem .sub{display:block;font-size:11px;color:var(--mut);font-weight:400}
.pr{display:flex;gap:3px}
.pr button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;padding:0}
.pr button.on1{background:#d63b2f;border-color:#d63b2f}
.pr button.on2{background:#e08a1e;border-color:#e08a1e}
.pr button.on3{background:#2e8b4a;border-color:#2e8b4a}
.rtp1{background:#e4f2e7;color:var(--ok);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
.rtp2{background:#fdf3dc;color:var(--warn);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
.rtp3{background:#fde3e1;color:var(--err);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700}
@media(max-width:680px){
header{padding:9px 10px 11px}
.brand{font-size:clamp(19px,5.4vw,24px)}
.brand .medal{width:clamp(30px,8vw,40px)}
nav.topnav{display:none}
.fontbtn{width:32px;height:32px;font-size:13px}
.fmenu{min-width:140px}
.bottombar{display:flex}
main{padding:14px 12px calc(100px + env(safe-area-inset-bottom))}
.toast{bottom:calc(96px + env(safe-area-inset-bottom))}
.wrow{grid-template-columns:1fr 1fr}
.wrow .wdel{grid-column:span 2}
.frow2 .grid3{grid-template-columns:1fr}
.todobox{grid-template-columns:1fr 1fr}
.todobox .field:nth-child(2){grid-column:span 2}
.mbody{min-width:160px}
.rtsum{gap:6px}
.rtcat{font-size:11.5px;padding:7px 8px}
}
@media(max-width:560px){.row{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.visitrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">
      <svg class="medal" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="medalGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7e6a8"/><stop offset=".5" stop-color="#d4b262"/><stop offset="1" stop-color="#8a6d1c"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="55" fill="none" stroke="url(#medalGold)" stroke-width="5"/>
        <circle cx="60" cy="60" r="44" fill="#101d36"/>
        <circle cx="60" cy="60" r="44" fill="none" stroke="url(#medalGold)" stroke-width="1.5" opacity=".8"/>
        <path d="M40 61 l13 14 L82 42" stroke="url(#medalGold)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>آریا ملک</span>
    </div>
    <div class="fmenu-wrap">
      <button type="button" id="fontBtn" class="fontbtn" onclick="toggleFontMenu(event)" title="انتخاب فونت">ف</button>
      <div class="fmenu" id="fontMenu">
        <button data-f="Vazirmatn" onclick="pickFont('Vazirmatn')">وزیرمتن</button>
        <button data-f="IRANSansX" onclick="pickFont('IRANSansX')">ایران‌سنس‌ایکس</button>
        <button data-f="Shabnam" onclick="pickFont('Shabnam')">شبنم</button>
        <button data-f="Sahel" onclick="pickFont('Sahel')">ساحل</button>
      </div>
    </div>
    <nav class="topnav">
      <button data-v="dash" onclick="go('dash')">📊 داشبورد</button>
      <button data-v="routine" onclick="go('routine')">🗓 روتین</button>
      <button data-v="prios" onclick="go('prios')">⏰ اولویت‌ها<span class="nbadge" id="prioBadge" style="display:none"></span></button>
      <button data-v="props" onclick="go('props')">🏠 فایل‌ها</button>
      <button data-v="custs" onclick="go('custs')">👤 مشتری‌ها</button>
      <button data-v="contracts" onclick="go('contracts')">📄 قراردادها</button>
      <button data-v="follow" onclick="go('follow')">📞 پیگیری‌ها<span class="nbadge" id="followBadge" style="display:none"></span></button>
      <button data-v="match" onclick="go('match')">🎯 مچینگ</button>
      <button data-v="export" onclick="go('export')">💾 خروجی</button>
    </nav>
  </div>
</header>
<main id="app"></main>
<nav class="bottombar" id="bbar">
  <button data-v="dash" onclick="go('dash')"><span class="ic">📊</span><span>داشبورد</span></button>
  <button data-v="routine" onclick="go('routine')"><span class="ic">🗓</span><span>روتین</span></button>
  <button data-v="props" onclick="go('props')"><span class="ic">🏠</span><span>فایل‌ها</span></button>
  <button data-v="custs" onclick="go('custs')"><span class="ic">👤</span><span>مشتری‌ها</span></button>
  <button data-v="contracts" onclick="go('contracts')"><span class="ic">📄</span><span>قرارداد</span></button>

"use strict";

function esc(s){
 return (s==null?'':String(s))
  .replace(/[&<>"']/g,function(c){
   return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function faNum(v){
 return String(v==null?'':v).replace(/\d/g,function(d){return FA[+d]});
}
function enNum(s){
 return String(s||'')
  .replace(/[۰-۹]/g,function(d){return String(FA.indexOf(d))})
  .replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))});
}
function norm(s){
 return String(s==null?'':s)
  .replace(/ي/g,'ی').replace(/ك/g,'ک')
  .replace(/\u200c/g,' ').trim();
}
var FLOORS=['همکف','اول','دوم','سوم','چهارم','پنجم','ششم','هفتم','هشتم','نهم','دهم','یازدهم','دوازدهم','سیزدهم','چهاردهم'];

function fdiv(a,b){return ~~(a/b)}
function fmod(a,b){return a-~~(a/b)*b}
function jalCal(jy){
 var br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
 var gy=jy+621,lj=-14,jp=br[0],jm,jump=0,n,i;
 for(i=1;i<br.length;i++){
  jm=br[i];jump=jm-jp;
  if(jy<jm)break;
  lj=lj+fdiv(jump,33)*8+fdiv(fmod(jump,33),4);
  jp=jm;
 }
 n=jy-jp;
 lj=lj+fdiv(n,33)*8+fdiv(fmod(n,33)+3,4);
 if(fmod(jump,33)===4&&jump-n===4)lj++;
 var lg=fdiv(gy,4)-fdiv((fdiv(gy,100)+1)*3,4)-150;
 var march=20+lj-lg;
 if(jump-n<6)n=n-jump+fdiv(jump+4,33)*33;
 var leap=fmod(fmod(n+1,33)-1,4);
 if(leap===-1)leap=4;
 return{gy:gy,march:march,leap:leap};
}
function g2d(gy,gm,gd){
 var d=fdiv((gy+fdiv(gm-8,6)+100100)*1461,4)+fdiv(153*fmod(gm+9,12)+2,5)+gd-34840408;
 return d-fdiv(fdiv(gy+100100+fdiv(gm-8,6),100)*3,4)+752;
}
function d2g(j){
 var a=4*j+139361631;
 a=a+fdiv(fdiv(4*j+183187720,146097)*3,4)*4-3908;
 var i=fdiv(fmod(a,1461),4)*5+308;
 var gd=fdiv(fmod(i,153),5)+1;
 var gm=fmod(fdiv(i,153),12)+1;
 var gy=fdiv(a,1461)-100100+fdiv(8-gm,6);
 return{gy:gy,gm:gm,gd:gd};
}
function d2j(jn){
 var gy=d2g(jn).gy,jy=gy-621,r=jalCal(jy),j1=g2d(gy,3,r.march),k,jm,jd;
 if(jn>=j1){k=jn-j1+1}
 else{jy--;r=jalCal(jy);j1=g2d(gy-1,3,r.march);k=jn-j1+1}
 if(k<=185){jm=1+fdiv(k,31);jd=fmod(k,31)+1}
 else{jm=8+fdiv(k-186,30);jd=fmod(k-186,30)+1}
 return{jy:jy,jm:jm,jd:jd};
}
function jalStrOf(off){
 var n=new Date();
 n.setDate(n.getDate()+off);
 try{
  var s=new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(n);
  var p=enNum(s).replace(/[^\d/]/g,'').split('/').filter(Boolean);
  if(p.length===3&&+p[0]>1200&&+p[0]<1600){
   return p[0]+'/'+p[1].padStart(2,'0')+'/'+p[2].padStart(2,'0');
  }
 }catch(e){}
 var j=d2j(g2d(n.getFullYear(),n.getMonth()+1,n.getDate()));
 return j.jy+'/'+String(j.jm).padStart(2,'0')+'/'+String(j.jd).padStart(2,'0');
}
function todayEN(){return jalStrOf(0)}
function fmtJLong(str){
 var p=enNum(String(str||'')).replace(/[^\d/]/g,'').split('/').map(Number);
 if(p.length!==3||!p[0]||!p[1]||!p[2])return esc(str||'—');
 return faNum(p[2])+' '+(MN[p[1]-1]||faNum(p[1]))+' '+faNum(p[0]);
}

 v=enNum(String(v||'')).replace(/[^\d/]/g,'');
 if(!v)return '';
 var p=v.split('/').filter(Boolean);
 if(p.length!==3)return null;
 var y=+p[0],m=+p[1],d=+p[2];
 if(!y||y<1300||y>1500||m<1||m>12||d<1||d>31)return null;
 if(m>6&&d>30)return null;
 return y+'/'+String(m).padStart(2,'0')+'/'+String(d).padStart(2,'0');
}

    c.anbari=Array.isArray(c.anbari)?c.anbari:(c.anbari?['حتماً']:[]);
    c.tahliye=Array.isArray(c.tahliye)?c.tahliye:[];
    if(c.followPrio==null)c.followPrio='';
    if(c.residence==null)c.residence='';
    if(c.units==null)c.units='';
    if(c.noteA==null)c.noteA='';
    if(c.vVisit==null)c.vVisit='';
    c.purpose=Array.isArray(c.purpose)?c.purpose:[];
    c.interiors=Array.isArray(c.interiors)?c.interiors:[];
    c.amen=Array.isArray(c.amen)?c.amen:[];
   });
   store.contracts.forEach(function(c){
    if(c.status==null)c.status='فعال';
    c.who=Array.isArray(c.who)?c.who:[];
    if(c.whoName==null)c.whoName='';

     'fCommB','fCommTotal','fShareMe','fShareOffice','fSharePartner','fNotes',
     'oDate','oTime','oNotes','notes'];
    ks.forEach(function(k){if(c[k]==null)c[k]=''});

    nums.forEach(function(k){c[k]=+enNum(c[k])||0});

   });
   store.prios.forEach(function(t){

 r.innerHTML='<div class="modal-bg"><div class="modal">'+inner+'</div></div>';
 r.querySelector('.modal-bg').addEventListener('click',function(e){
  if(e.target===this)closeModal();
 });
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function matchesQ(hay,q){
 q=String(q||'').trim();
 if(!q)return true;
 var qn=norm(enNum(q)).toLowerCase();
 if(!qn)return true;
 var big=(hay+' '+enNum(hay)+' '+faNum(hay)).toLowerCase();
 return qn.split(/\s+/).every(function(t){
  return big.indexOf(norm(t).toLowerCase())>-1;
 });
}
var DRAFT_KEY='tikabi_propDraft';
var _draftTimer=null;
function readDraft(){
 try{
  var r=localStorage.getItem(DRAFT_KEY);
  if(!r)return null;
  var d=JSON.parse(r);
  return d&&typeof d==='object'?d:null;
 }catch(e){return null}
}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function saveDraftSilent(d){
 if(!d)return;
 try{localStorage.setItem(DRAFT_KEY,JSON.stringify(d))}
 catch(e){
  try{
   var light=Object.assign({},d,{media:[]});
   localStorage.setItem(DRAFT_KEY,JSON.stringify(light));
  }catch(e2){}
 }
}

function scheduleDraft(){
 clearTimeout(_draftTimer);
 _draftTimer=setTimeout(function(){
  try{
   if(isPropFormOpen()&&editing==null)saveDraftSilent(collectPropDraft());
  }catch(e){}
 },350);
}
document.addEventListener('input',function(){scheduleDraft()});
document.addEventListener('change',function(){scheduleDraft()});
window.addEventListener('beforeunload',function(){
 try{
  if(isPropFormOpen()&&editing==null)saveDraftSilent(collectPropDraft());
 }catch(e){}
});
document.addEventListener('visibilitychange',function(){
 if(document.hidden){
  try{
   if(isPropFormOpen()&&editing==null)saveDraftSilent(collectPropDraft());
  }catch(e){}
 }
});

function phaseBtnLabel(v){
 var n=parseInt(v,10);
 return '📍 '+(PH_LABEL[isNaN(n)?0:n]||('فاز '+n))+' (برای تغییر بزنید)';
}
function cyclePhase(){
 var inp=document.getElementById('pf_phase');
 if(!inp)return;
 var v=parseInt(inp.value,10);
 if(isNaN(v))v=0;
 v=(v+1)%7;
 inp.value=String(v);
 document.getElementById('pf_phaseBtn').textContent=phaseBtnLabel(v);
 scheduleDraft();
}
function setPhaseBtn(v){
 var inp=document.getElementById('pf_phase');
 var btn=document.getElementById('pf_phaseBtn');
 if(!inp||!btn)return;
 inp.value=String(v==null||v===''?'0':v);
 btn.textContent=phaseBtnLabel(inp.value);
}

function officeSoonList(){

function officeLateList(){

  var n=parseJInput(c.oDate);
  return !!n&&n<t;
 });
}

function addTodo(){
 try{
  var dEl=document.getElementById('tp_date');
  var tEl=document.getElementById('tp_text');
  if(!tEl)return;
  var txt=tEl.value.trim();
  if(!txt){alert('متن یادداشت را بنویسید');return}
  var dt=parseJInput(dEl?dEl.value:'');
  store.prios.push({
   id:'T'+(store.seq++),seq:store.seq,date:dt||'',text:txt,
   status:'باز',createdTs:Date.now(),createdTime:nowClock()
  });
  if(!save()){return}
  renderPrios();
  toast('✅ یادداشت اضافه شد');
 }catch(err){
  alert('⚠️ خطای افزودن یادداشت: '+(err&&err.message?err.message:err));
 }
}
function doneTodo(id){
 var t=store.prios.find(function(x){return x.id===id});
 if(t){
  t.status=(t.status==='باز')?'انجام شد':'باز';
  save();
  renderPrios();
 }
}

 }
 var firstImgIdx=-1;
 for(var i=0;i<_propMedia.length;i++){
  if(_propMedia[i].t==='image'){firstImgIdx=i;break}
 }
 box.innerHTML=_propMedia.map(function(m,i){

   var t=(cov?'کاور — کلیک = حذف':'کلیک = حذف');

  }

 }).join('')||'<span class="mut" style="font-size:12px">رسانه‌ای انتخاب نشده</span>';

function compressImageEl(img){
 var w=img.width,h=img.height,mx=1280;
 if(Math.max(w,h)>mx){
  var k=mx/Math.max(w,h);
  w=Math.round(w*k);
  h=Math.round(h*k);
 }
 var cv=document.createElement('canvas');
 cv.width=w;
 cv.height=h;
 cv.getContext('2d').drawImage(img,0,0,w,h);
 var q=.8,d=cv.toDataURL('image/jpeg',q);
 while(d.length>2500000&&q>.35){
  q-=.12;
  d=cv.toDataURL('image/jpeg',q);
 }
 return d;
}
function previewMedia(inp){
 var files=[].slice.call(inp.files||[]);
 inp.value='';
 var imgCount=_propMedia.filter(function(m){return m.t==='image'}).length;
 var full=false;
 files.forEach(function(f){
  if(f.type&&f.type.indexOf('video/')===0){
   if(f.size>2000000){
    alert('ویدیوی «'+f.name+'» بزرگ‌تر از حد مجاز است (حداکثر ۲ مگابایت).');
    return;
   }
   var r=new FileReader();
   r.onload=function(e){
    _propMedia.push({t:'video',d:e.target.result});
    renderMediaPrev();
    scheduleDraft();
   };
   r.readAsDataURL(f);
  }else if(f.type&&f.type.indexOf('image/')===0){
   if(imgCount>=MAX_IMGS){
    if(!full){
     alert('حداکثر '+faNum(MAX_IMGS)+' عکس مجاز است؛ عکس‌های اضافه نادیده گرفته شدند');
     full=true;
    }
    return;
   }
   var r2=new FileReader();
   r2.onload=function(e){
    var img=new Image();
    img.onload=function(){
     var d=e.target.result;
     if(d.length>2500000)d=compressImageEl(img);
     _propMedia.push({t:'image',d:d});
     imgCount++;
     renderMediaPrev();
     scheduleDraft();
    };
    img.onerror=function(){alert('تصویر «'+f.name+'» قابل خواندن نیست')};
    img.src=e.target.result;
   };
   r2.readAsDataURL(f);
  }else{
   alert('فرمت «'+f.name+'» پشتیبانی نمی‌شود؛ فقط عکس یا ویدیو انتخاب کنید');
  }
 });
}
function saveProp(){
 try{
  var g=function(id){
   var el=document.getElementById(id);
   return el?el.value.trim():'';
  };
  var old=editing&&editing.kind==='prop'?store.props.find(function(x){return x.id===editing.id}):null;
  if(editing&&editing.kind==='prop'&&!old){
   alert('فایل موردنظر یافت نشد؛ ممکن است حذف شده باشد');
   return;
  }
  var created,last,createdTs,createdTime;
  if(old){
   created=old.created;
   createdTs=old.createdTs||null;
   createdTime=old.createdTime||'';
   var lastRaw=parseJInput(g('pf_lastcall'));
   last=(lastRaw===null)?(old.lastcall||''):lastRaw;
  }else{
   created=parseJInput(g('pf_created'));
   if(created===null)created=todayEN();
   createdTs=Date.now();
   createdTime=nowClock();
   var lastRaw2=parseJInput(g('pf_lastcall'));
   last=(lastRaw2===null)?'':lastRaw2;
  }
  var bedEl=document.querySelector('#pf_bed .chip.on');
  var intEl=document.querySelector('#pf_int .chip.on');
  var phaseInp=document.getElementById('pf_phase');
  var phase=phaseInp?parseInt(phaseInp.value,10):0;
  if(isNaN(phase))phase=0;
  var amen=getChecksV('pf_amen').slice();
  if(getChecksV('pf_agahi').length>0&&amen.indexOf('آگهی شد')===-1){
   amen.push('آگهی شد');
  }
  var coverImg='';
  for(var mi=0;mi<_propMedia.length;mi++){
   if(_propMedia[mi].t==='image'){coverImg=_propMedia[mi].d;break}
  }
  var rec={
   id:old?old.id:'P'+(store.seq++),
   seq:old?(old.seq||store.seq):(store.seq),
   created:created,createdTs:createdTs,createdTime:createdTime,
   editedJ:todayEN(),editedTime:nowClock(),
   lastcall:last||'',
   status:g('pf_status')||'فعال',phase:phase,phases:[phase],
   project:g('pf_project'),block:g('pf_block'),
   bed:bedEl?+bedEl.dataset.val:1,
   area:+enNum(g('pf_area'))||null,
   floor:g('pf_floor'),dir:g('pf_dir'),
   interior:intEl?intEl.dataset.val:'',amen:amen,
   prio:chipVal('pf_prio'),
   price:+enNum(g('pf_price'))||0,
   floorPrice:+enNum(g('pf_floorprice'))||0,
   docs:g('pf_docs'),adlink:g('pf_adlink'),
   owner:g('pf_owner'),phone:enNum(g('pf_phone')),
   notes:g('pf_notes'),
   media:_propMedia.slice(),
   img:coverImg
  };
  if(old){
   var i=store.props.indexOf(old);
   store.props[i]=rec;
  }else{
   store.props.push(rec);
  }
  if(!save()){return}
  var savedId=rec.id;
  editing=null;
  clearDraft();
  closeModal();
  go('props');
  toast('✅ فایل '+savedId+' ذخیره شد');
 }catch(err){
  alert('⚠️ خطای ثبت فایل: '+(err&&err.message?err.message:err));
 }
}
function delProp(id){
 try{
  if(!confirm('این فایل حذف شود؟'))return;
  store.props=store.props.filter(function(x){return x.id!==id});
  if(!save()){renderAll();return}
  renderAll();
  toast('حذف شد');
 }catch(err){
  alert('⚠️ خطای حذف: '+(err&&err.message?err.message:err));
 }
}

</script>

 var ph=(c.phases||[]).map(Number).filter(function(x){return !isNaN(x)});
 if(!ph.length)return '—';
 return ph.map(function(x){return PH_LABEL[x]||('فاز '+x)}).join('، ');
}
function custBedsTxt(c){
 var b=(c.beds||[]).map(Number).filter(function(x){return !isNaN(x)});
 if(!b.length)return '—';
 return b.map(function(x){return faNum(x)+' خواب'}).join('، ');
}
function custFloorsTxt(c){
 var f=(c.floors||[]).map(Number).filter(function(x){return !isNaN(x)});
 if(!f.length)return '—';
 return f.map(function(x){return FLOORS[x]||faNum(x)}).join('، ');
}
function custTitle(c){
 var s=esc(c.name||'بدون نام');
 s+=' — '+custPhasesTxt(c);
 if(c.beds&&c.beds.length)s+=' — '+custBedsTxt(c);
 if(c.liquid)s+=' — نقدینگی '+fmtMoney(c.liquid);
 return s;
}

function saveCust(){
 try{
  var g=function(id){
   var el=document.getElementById(id);
   return el?el.value.trim():'';
  };
  var created=parseJInput(g('cf_created'));
  var fol=parseJInput(g('cf_follow'));
  if(created===null){
   alert('تاریخ ثبت نامعتبر است؛ مثال درست: ۱۴۰۴/۰۶/۲۵');
   return;
  }
  if(fol===null)fol='';
  var old=editing&&editing.kind==='cust'?store.custs.find(function(x){return x.id===editing.id}):null;
  if(editing&&editing.kind==='cust'&&!old){
   alert('مشتری موردنظر یافت نشد؛ ممکن است حذف شده باشد');
   return;
  }
  var rec={
   id:old?old.id:'C'+(store.seq++),
   seq:old?(old.seq||store.seq):(store.seq),
   created:created,follow:fol||'',
   name:g('cf_name'),phone:enNum(g('cf_phone')),
   liquid:+enNum(g('cf_liquid'))||'',
   where:g('cf_where'),
   purpose:getChecksV('cf_purpose'),
   noteA:g('cf_noteA'),
   phases:getChecksV('cf_phases').map(Number)
    .filter(function(x){return !isNaN(x)})
    .sort(function(a,b){return a-b}),
   project:g('cf_project'),
   beds:getChecksV('cf_beds').map(Number)
    .filter(function(x){return !isNaN(x)})
    .sort(function(a,b){return a-b}),
   floors:getChecksV('cf_floors').map(Number)
    .filter(function(x){return !isNaN(x)})
    .sort(function(a,b){return a-b}),
   interiors:getChecksV('cf_ints'),
   dir:g('cf_dir'),
   parv:getChecksV('cf_parv').length>0,
   parking:getChecksV('cf_parking'),
   anbari:getChecksV('cf_anbari'),
   tahliye:getChecksV('cf_tah'),
   followPrio:chipVal('cf_prio'),
   residence:g('cf_res'),
   units:g('cf_units'),
   vVisit:g('cf_vvisit'),
   notes:g('cf_notes'),
   amen:(old&&old.amen)||[]
  };
  if(old){
   var i=store.custs.indexOf(old);
   store.custs[i]=rec;
  }else{
   store.custs.push(rec);
  }
  if(!save()){return}
  var savedId=rec.id;
  editing=null;
  closeModal();
  if(view==='custs')renderCusts();
  else go('custs');
  toast('✅ مشتری '+savedId+' ذخیره شد');
 }catch(err){
  alert('⚠️ خطای ثبت مشتری: '+(err&&err.message?err.message:err));
 }
}
function delCust(id){
 try{
  if(!confirm('این مشتری حذف شود؟'))return;
  store.custs=store.custs.filter(function(x){return x.id!==id});
  if(!save()){renderAll();return}
  renderAll();
  toast('حذف شد');
 }catch(err){
  alert('⚠️ خطای حذف: '+(err&&err.message?err.message:err));
 }
}

<script>
/* قطعه ۸: قراردادها — ذخیره و حذف */
"use strict";
function saveContractC(){
 try{
  var g=function(id){
   var el=document.getElementById(id);
   return el?el.value.trim():'';
  };
  var old=editK?store.contracts.find(function(x){return x.id===editK.id}):null;
  if(editK&&!old){
   alert('قرارداد موردنظر یافت نشد؛ ممکن است حذف شده باشد');
   return;
  }
  var created=old?old.created:parseJInput(g('kf_created'));
  if(!old&&created===null){
   alert('تاریخ ثبت قرارداد نامعتبر است؛ مثال: ۱۴۰۴/۰۶/۲۵');
   return;
  }
  var oRaw=parseJInput(g('kf_oDate'));
  var wds=_cwds.map(function(w){
   return{
    amt:+enNum(w.amt)||0,
    date:parseJInput(w.date)||w.date||'',
    pay:w.pay||'',
    note:w.note||''
   };
  });
  var cfols=_cfols.map(function(f){
   return{
    date:parseJInput(f.date)||f.date||'',
    subj:f.subj||'',
    status:f.status||'باز',
    text:f.text||''
   };
  });
  var commS=+enNum(g('kf_fCommS'))||0;
  var commB=+enNum(g('kf_fCommB'))||0;
  var phEl=document.getElementById('kf_phase');
  var pPhase=phEl?parseInt(phEl.value,10):0;
  if(isNaN(pPhase))pPhase=0;
  var rec={
   id:old?old.id:'Q'+(store.seq++),
   seq:old?(old.seq||store.seq):(store.seq),
   created:created,
   createdTs:old?(old.createdTs||null):Date.now(),
   createdTime:old?(old.createdTime||''):nowClock(),
   editedJ:todayEN(),editedTime:nowClock(),
   status:chipVal('kf_status')||'فعال',
   who:getChecksV('kf_who'),whoName:g('kf_whoName'),whoType:chipVal('kf_whoType'),
   sName:g('kf_sName'),sPhone:enNum(g('kf_sPhone')),sNotes:g('kf_sNotes'),
   pLink:g('kf_pLink'),pPhase:pPhase,
   pProject:g('kf_pProject'),pBlock:g('kf_pBlock'),
   pArea:+enNum(g('kf_pArea'))||'',
   pBeds:g('kf_pBeds'),pFloor:g('kf_pFloor'),pAddr:g('kf_pAddr'),pNotes:g('kf_pNotes'),
   bLink:g('kf_bLink'),
   bName:g('kf_bName'),bPhone:enNum(g('kf_bPhone')),bNotes:g('kf_bNotes'),
   fDeal:+enNum(g('kf_fDeal'))||0,
   fCommS:commS,fCommB:commB,fCommTotal:commS+commB,
   fShareMe:+enNum(g('kf_fShareMe'))||0,
   fShareOffice:+enNum(g('kf_fShareOffice'))||0,
   fSharePartner:+enNum(g('kf_fSharePartner'))||0,
   fNotes:g('kf_fNotes'),
   wds:wds,
   oDate:oRaw||'',oTime:g('kf_oTime'),oNotes:g('kf_oNotes'),
   cfFollows:cfols,
   notes:g('kf_notes')
  };
  if(old){
   var i=store.contracts.indexOf(old);
   store.contracts[i]=rec;
  }else{
   store.contracts.push(rec);
  }
  if(!save()){return}
  var savedId=rec.id;
  editK=null;
  closeModal();
  if(view==='contracts')renderContracts();
  else go('contracts');
  toast('✅ قرارداد '+savedId+' ذخیره شد');
 }catch(err){
  alert('⚠️ خطای ثبت قرارداد: '+(err&&err.message?err.message:err));
 }
}
function delContractC(id){
 try{
  if(!confirm('این قرارداد حذف شود؟'))return;
  store.contracts=store.contracts.filter(function(x){return x.id!==id});
  if(!save()){renderContracts();return}
  renderContracts();
  toast('حذف شد');
 }catch(err){
  alert('⚠️ خطای حذف: '+(err&&err.message?err.message:err));
 }
}

var matchMode='c2p',selId='';
function scoreMatch(p,c){
 var r=[],raw=0,max=0;
 max+=25;
 var cp=(c.phases&&c.phases.length)?c.phases.map(Number):[];
 if(cp.length){
  if(cp.indexOf(+p.phase)>-1){raw+=25;r.push('✅ فاز مناسب')}
  else{r.push('❌ فاز متفاوت')}
 }else{r.push('– فاز ثبت نشده')}
 max+=25;
 var cb=(c.beds||[]).map(Number);
 if(cb.length){
  if(cb.indexOf(+p.bed)>-1){raw+=25;r.push('✅ تعداد خواب مناسب')}
  else{r.push('❌ تعداد خواب متفاوت')}
 }else{r.push('– خواب ثبت نشده')}
 max+=25;
 var price=+p.price||0;
 var liq=+c.liquid||0;
 if(liq){
  if(price&&price<=liq){raw+=25;r.push('✅ نقدینگی کافی')}
  else if(price&&price<=liq*1.10){raw+=15;r.push('⚠️ کمی بالاتر از نقدینگی')}
  else{r.push('❌ خارج از نقدینگی')}
 }else{r.push('– نقدینگی ثبت نشده')}
 max+=8;
 if(c.project&&p.project&&norm(c.project)===norm(p.project)){
  raw+=8;
  r.push('✅ پروژه مناسب');
 }else{r.push('⚠️ پروژه متفاوت')}
 max+=7;
 var cf=(c.floors||[]).map(Number);
 if(cf.length){
  var f=+p.floor||0;
  if(cf.indexOf(f)>-1){raw+=7;r.push('✅ طبقه مناسب')}
  else if(cf.some(function(x){return Math.abs(x-f)===1})){raw+=4;r.push('⚠️ یک طبقه فاصله')}
  else{r.push('⚠️ طبقه خارج از محدوده')}
 }else{r.push('– طبقه ثبت نشده')}
 var pk=c.parking||[];
 if(pk.indexOf('حتماً')>-1){
  max+=4;
  if((p.amen||[]).indexOf('پارکینگ مسقف')>-1){raw+=4;r.push('✅ پارکینگ دارد')}
  else{r.push('❌ فاقد پارکینگ (الزامی)')}
 }else if(pk.indexOf('ترجیحاً')>-1){
  max+=4;
  if((p.amen||[]).indexOf('پارکینگ مسقف')>-1){raw+=4;r.push('✅ پارکینگ دارد')}
  else{raw+=2;r.push('⚠️ فاقد پارکینگ (ترجیحی)')}
 }
 var an=c.anbari||[];
 if(an.indexOf('حتماً')>-1){
  max+=4;
  if((p.amen||[]).indexOf('انباری')>-1){raw+=4;r.push('✅ انباری دارد')}
  else{r.push('❌ فاقد انباری (الزامی)')}
 }else if(an.indexOf('ترجیحاً')>-1){
  max+=4;
  if((p.amen||[]).indexOf('انباری')>-1){raw+=4;r.push('✅ انباری دارد')}
  else{raw+=2;r.push('⚠️ فاقد انباری (ترجیحی)')}
 }
 var th=c.tahliye||[];
 if(th.length){
  max+=4;
  var has=th.some(function(t){return (p.amen||[]).indexOf(t)>-1});
  if(has){raw+=4;r.push('✅ تخلیه')}
  else{r.push('⚠️ فاقد تخلیه')}
 }
 max+=4;
 if((c.interiors||[]).length){
  if((c.interiors||[]).indexOf(p.interior)>-1){raw+=4;r.push('✅ امکانات داخلی مناسب')}
  else{r.push('⚠️ داخلی متفاوت')}
 }else{r.push('– داخلی ثبت نشده')}
 max+=3;
 if(c.dir){
  if(c.dir===p.dir){raw+=3;r.push('✅ جهت مناسب')}
  else{r.push('⚠️ جهت متفاوت')}
 }else{r.push('– جهت ثبت نشده')}
 var pct=max?Math.min(100,Math.round(raw/max*100)):0;
 return{pct:pct,reasons:r};
}
function findMatches(id,mode){
 if(mode==='c2p'){
  var c=store.custs.find(function(x){return x.id===id});
  if(!c)return[];
  return store.props.map(function(p){
   var s=scoreMatch(p,c);
   return {item:p,kind:'p',pct:s.pct,reasons:s.reasons};
  }).sort(function(a,b){return b.pct-a.pct}).slice(0,10);
 }
 var p=store.props.find(function(x){return x.id===id});
 if(!p)return[];
 return store.custs.map(function(c){
  var s=scoreMatch(p,c);
  return {item:c,kind:'c',pct:s.pct,reasons:s.reasons};
 }).sort(function(a,b){return b.pct-a.pct}).slice(0,10);
}

<script>
/* قطعه ۱۰: روتین و اولویت امروز */
"use strict";
var RT_CATS=[
 {k:'find',icon:'🔍',name:'فایل‌یابی'},
 {k:'calls',icon:'📞',name:'تماس‌ها'},
 {k:'ads',icon:'📢',name:'آگهی‌ها'},
 {k:'intro',icon:'🤝',name:'معرفی فایل'},
 {k:'visit',icon:'👀',name:'قرار بازدید'},
 {k:'content',icon:'🎬',name:'تولید محتوا'}
];
var CNT_ST=['ایده','در تولید','آماده انتشار','انتشار شد'];
var rtFilter='all';
function rtDayReset(){
 var dl=store.daylog;
 if(dl.date!==todayEN()){
  dl.date=todayEN();
  dl.done={};
 }
}
function rtPrioOf(key,fp){
 var v=store.daylog.prio[key];
 if(v!=null&&v!=='')return String(v);
 if(fp)return String(fp);
 return '2';
}
function rtNextPrio(cur){
 if(cur==='1')return '2';
 if(cur==='2')return '3';
 return '1';
}
function rtSetPrio(key,ref){
 try{
  var cur=rtPrioOf(key);
  var nv=rtNextPrio(cur);
  store.daylog.prio[key]=nv;
  if(ref&&ref.charAt(0)==='P'){
   var p=store.props.find(function(x){return x.id===ref});
   if(p)p.prio=nv;
  }
  if(ref&&ref.charAt(0)==='C'){
   var c=store.custs.find(function(x){return x.id===ref});
   if(c)c.followPrio=nv;
  }
  if(!save())return;
  renderAll();
 }catch(err){
  alert('⚠️ خطای اولویت: '+(err&&err.message?err.message:err));
 }
}
function rtMarkDone(key){
 try{
  var dl=store.daylog;
  if(dl.done[key]){
   dl.done[key]=false;
   if(key.indexOf('vst:')===0){
    var v=store.visits.find(function(x){return x.id===key.slice(4)});
    if(v)v.done=false;
   }
   if(key.indexOf('cnt:')===0){
    var k=store.content.find(function(x){return x.id===key.slice(4)});
    if(k)k.st='آماده انتشار';
   }
  }else{
   dl.done[key]=true;
   if(key.indexOf('call:')===0){
    var pid=key.slice(5);
    var p2=store.props.find(function(x){return x.id===pid});
    if(p2)p2.lastcall=todayEN();
   }
   if(key.indexOf('fol:')===0){
    var fid=key.slice(4);
    var f=store.follows.find(function(x){return x.id===fid});
    if(f)f.status='انجام شده';
   }
   if(key.indexOf('vst:')===0){
    var v2=store.visits.find(function(x){return x.id===key.slice(4)});
    if(v2){v2.done=true;v2.doneDate=todayEN()}
   }
   if(key.indexOf('cnt:')===0){
    var k2=store.content.find(function(x){return x.id===key.slice(4)});
    if(k2)k2.st='انتشار شد';
   }
  }
  if(!save())return;
  renderAll();
 }catch(err){
  alert('⚠️ خطای ثبت انجام: '+(err&&err.message?err.message:err));
 }
}

   if(pp)fp=pp.prio;

  if(f.refId&&f.refId.charAt(0)==='C'){
   var cc=store.custs.find(function(x){return x.id===f.refId});
   if(cc)fp=cc.followPrio;

 for(i=0;i<store.props.length;i++){

   });

   items.push({
    key:'adfix:'+p.id,cat:'ads',

    fp:rtPrioOf('adfix:'+p.id,p.prio),
    open:"editProp('"+p.id+"')"
   });
  }
 }
 for(i=0;i<store.custs.length;i++){

  if(ms.length&&ms[0].pct>=70){

    fp:rtPrioOf('mch:'+c.id,c.followPrio),
    open:"matchFromCust('"+c.id+"')"
   });
  }
 }
 for(i=0;i<store.visits.length;i++){
  var v=store.visits[i];

  items.push({
   key:'vst:'+v.id,cat:'visit',
   label:'بازدید: '+(v.name||'—'),
   sub:'🗓 '+(v.date?fmtJLong(v.date):'—')+(v.time?' ساعت '+faNum(v.time):''),
   ref:v.propId||'',
   fp:rtPrioOf('vst:'+v.id,'1'),
   open:"visitResult('"+v.id+"')"

 }
 for(i=0;i<store.content.length;i++){

  items.push({

"use strict";
function dl(name,content,type){
 var b=new Blob([content],{type:type||'text/plain;charset=utf-8'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(b);
 a.download=name;
 document.body.appendChild(a);
 a.click();
 setTimeout(function(){
  URL.revokeObjectURL(a.href);
  a.remove();
 },400);
}
function csvRows(rows){
 return rows.map(function(r){

 }).join('\r\n');

function exportContracts(){
 var H=['کد قرارداد','تاریخ ثبت','ساعت ثبت','آخرین ویرایش','وضعیت','نوع همکاری','نام همکار','نوع همکاری (تقسیم)','فروشنده','تلفن فروشنده','توضیحات فروشنده','متصل به فایل','فاز','پروژه','زون/بلوک','متراژ','خواب','طبقه','آدرس ملک','توضیحات ملک','متصل به مشتری','خریدار','تلفن خریدار','توضیحات خریدار','مبلغ کل معامله','کمیسیون فروشنده','کمیسیون خریدار','جمع کل کمیسیون','سهم من','سهم دفتر','سهم همکار','توضیحات تقسیم','برداشت‌ها','جمع برداشت من','مانده سهم من','تاریخ دفترخانه','ساعت دفترخانه','توضیحات دفترخانه','پیگیری‌های قرارداد','یادداشت‌ها'];

var _restoreData=null;
function onRestoreFile(inp){
 var f=inp.files&&inp.files[0];
 if(!f)return;
 var rd=new FileReader();
 rd.onload=function(e){
  try{
   var d=JSON.parse(e.target.result);
   if(!d||!Array.isArray(d.props))throw new Error('bad');
   _restoreData=d;
   toast('فایل بکاپ خوانده شد — حالا «بازیابی» یا «ادغام» را بزنید');
  }catch(err){
   _restoreData=null;
   alert('فایل بکاپ معتبر نیست');
  }
 };
 rd.readAsText(f);
}
function restore(){
 if(!_restoreData){alert('ابتدا فایل بکاپ را انتخاب کنید');return}
 var ok=confirm('اطلاعات فعلی به‌کلی با اطلاعات بکاپ جایگزین می‌شود. ادامه می‌دهید؟');
 if(!ok)return;
 store=JSON.parse(JSON.stringify(_restoreData));
 loadStore();
 save();
 renderAll();
 toast('بازیابی انجام شد ✅');
}
function mergeRestore(){
 if(!_restoreData){alert('ابتدا فایل بکاپ را انتخاب کنید');return}
 var ok=confirm('اطلاعات بکاپ با اطلاعات فعلی «ادغام» می‌شود:\n• موارد جدید اضافه می‌شوند\n• موارد تکراری فقط اگر نسخه بکاپ جدیدتر باشد به‌روز می‌شوند\n• هیچ اطلاع فعلی حذف نمی‌شود\nادامه می‌دهید؟');
 if(!ok)return;
 var added=0,updated=0;
 var keys=['props','custs','follows','contracts','prios','visits','content'];
 keys.forEach(function(k){
  var inc=_restoreData[k]||[];
  if(!Array.isArray(store[k]))store[k]=[];
  inc.forEach(function(r){
   if(!r||!r.id)return;
   var i=store[k].findIndex(function(x){return x.id===r.id});
   if(i<0){
    store[k].push(r);
    added++;
   }else{
    var cur=store[k][i];
    var nt=+r.editedTs||+r.createdTs||0;
    var ct=+cur.editedTs||+cur.createdTs||0;
    if(nt>ct){
     store[k][i]=r;
     updated++;
    }
   }
  });
 });
 if(_restoreData.seq>store.seq)store.seq=_restoreData.seq;
 if(!save())return;
 renderAll();
 toast('ادغام انجام شد ✅ — جدید: '+faNum(added)+' | به‌روزرسانی: '+faNum(updated));
}
function forceRemove(){
 var t=prompt('شناسه فایل مشکل‌دار را دقیق بنویس (مثال: P1)','P1');
 if(t==null)return;
 var id=t.trim();
 if(!id)return;
 var before=store.props.length;
 store.props=store.props.filter(function(p){return String(p.id)!==id});
 if(store.props.length===before){
  alert('فایلی با شناسه «'+id+'» پیدا نشد.');
  return;
 }
 if(save()){
  renderAll();
  toast('فایل '+id+' برای همیشه حذف شد ✅');
 }else{
  renderAll();
  alert('حذف انجام شد ولی ذخیره نشد؛ چند عکس حذف کنید و دوباره تلاش کنید.');
 }
}
function clearStrayDraft(){
 clearDraft();
 renderAll();
 toast('پیش‌نویس پاک شد ✅');
}

 h+='<div class="btnrow">';

 }

<script>
/* قطعه ۱۲: همگام‌سازی ابری */
"use strict";
var GH_DATA='https://api.github.com/repos/aryamelk/aria-melk-data/contents/data.json';
function ghTok(){
 try{return localStorage.getItem('aria_gh_token')||''}catch(e){return ''}
}
function ghSaveTok(){
 var t=document.getElementById('gh_tok');
 var v=t?t.value.trim():'';
 if(!v){alert('توکن را وارد کنید');return}
 try{localStorage.setItem('aria_gh_token',v)}catch(e){}
 toast('توکن ذخیره شد ✅');
 ghSyncInfo();
}
function ghSyncInfo(){
 var el=document.getElementById('gh_info');
 if(el)el.textContent=ghTok()?'✅ توکن ذخیره شده — آماده همگام‌سازی':'❌ توکن ذخیره نشده است';
}
setTimeout(ghSyncInfo,100);
function cloudUpload(){
 var t=ghTok();
 if(!t){alert('اول توکن را ذخیره کنید');return}
 if(!confirm('اطلاعات همین دستگاه به ابر بارگذاری شود؟ (اطلاعات قبلی ابر جایگزین می‌شود)'))return;
 toast('در حال بارگذاری…');
 fetch(GH_DATA,{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github+json','User-Agent':'aria-melk'}})
 .then(function(r){return r.status===200?r.json():null})
 .then(function(j){
  var payload={
   message:'sync '+todayEN()+' '+nowClock(),
   content:btoa(unescape(encodeURIComponent(JSON.stringify(store))))
  };
  if(j&&j.sha)payload.sha=j.sha;
  return fetch(GH_DATA,{method:'PUT',
   headers:{'Authorization':'token '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'aria-melk'},
   body:JSON.stringify(payload)});
 })
 .then(function(r){
  if(r.ok)toast('✅ اطلاعات به ابر بارگذاری شد');
  else r.text().then(function(){alert('بارگذاری نشد (کد '+r.status+') — توکن را چک کن')});
 })
 .catch(function(e){alert('خطای شبکه: '+e)});
}
function cloudDownload(){
 var t=ghTok();
 if(!t){alert('اول توکن را ذخیره کنید');return}
 toast('در حال دریافت…');
 fetch(GH_DATA,{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github.raw','User-Agent':'aria-melk'}})
 .then(function(r){
  if(!r.ok)throw new Error('در ابر چیزی نیست (اول از دستگاه دیگر بارگذاری کن)');
  return r.text();
 })
 .then(function(txt){
  var d=JSON.parse(txt);
  if(!d||!Array.isArray(d.props))throw new Error('فایل ابر معتبر نیست');
  var ok=confirm('دریافت انجام شد.\n\nتایید = ادغام با اطلاعات همین دستگاه (هیچ چیزی حذف نمی‌شود)\nانصراف = جایگزینی کامل اطلاعات این دستگاه با ابر');
  if(ok){
   var added=0,updated=0;
   var keys=['props','custs','follows','contracts','prios','visits','content'];
   keys.forEach(function(k){
    var inc=(d[k]&&Array.isArray(d[k]))?d[k]:[];
    if(!Array.isArray(store[k]))store[k]=[];
    inc.forEach(function(r2){
     if(!r2||!r2.id)return;
     var i=store[k].findIndex(function(x){return x.id===r2.id});
     if(i<0){store[k].push(r2);added++}
     else{
      var cur=store[k][i];
      var nt=+r2.editedTs||+r2.createdTs||0;
      var ct=+cur.editedTs||+cur.createdTs||0;
      if(nt>ct){store[k][i]=r2;updated++}
     }
    });
   });
   if(d.seq>store.seq)store.seq=d.seq;
   save();
   renderAll();
   toast('✅ ادغام شد — جدید: '+faNum(added)+' | به‌روزرسانی: '+faNum(updated));
  }else{
   store=JSON.parse(JSON.stringify(d));
   loadStore();
   save();
   renderAll();
   toast('✅ جایگزینی کامل انجام شد');
  }
 })
 .catch(function(e){alert('دریافت نشد: '+e.message)});
}
</script>
</body>
